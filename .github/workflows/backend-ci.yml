name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Built here, on the runner, so the droplet never needs npm/tsc.
      # 6-F2 adds the deploy job once 6-E's infra/ exists to deploy against.
      - run: docker build -t multiprice-backend:local .
      - run: docker save multiprice-backend:local | gzip > backend-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: apps/backend/backend-image.tar.gz
          retention-days: 1

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: apps/backend

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The droplet runs one shared compose stack (infra/compose.yml) under
      # ~/multiprice. Both backend-ci.yml and frontend-ci.yml sync the same
      # infra/ directory there — whichever deploys last wins on infra
      # config, which is fine since infra/ is shared and identical either
      # way. No --delete: infra/.env is droplet-only (gitignored, not in
      # the synced source) and must survive a concurrent deploy from the
      # other workflow — multip hit this exact race with --delete.
      - name: Copy deploy assets to droplet
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'mkdir -p ~/multiprice/infra'
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            infra/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/multiprice/infra/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            apps/backend/backend-image.tar.gz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/multiprice/backend-image.tar.gz"

      - name: Load image and (re)start on droplet
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd ~/multiprice
            if [ ! -f infra/.env ]; then
              cp infra/.env.example infra/.env
              chmod 600 infra/.env
              echo "infra/.env created from the example. JWT_SECRET is still blank — set it by hand once before the stack will boot."
            fi
            docker load < backend-image.tar.gz
            rm -f backend-image.tar.gz
            docker compose -f infra/compose.yml up -d --no-build
          '

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ secrets.DEPLOY_HOST }}/api/health"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 5
          done
          echo "Smoke test failed"
          exit 1

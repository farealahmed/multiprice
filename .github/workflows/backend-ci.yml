name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Built here, on the runner, so the droplet never needs npm/tsc.
      # 6-F2 adds the deploy job once 6-E's infra/ exists to deploy against.
      - run: docker build -t multiprice-backend:local .
      - run: docker save multiprice-backend:local | gzip > backend-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: apps/backend/backend-image.tar.gz
          retention-days: 1

name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "infra/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "infra/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Built here, on the runner, so the droplet never needs npm/next build.
      # 6-F2 adds the deploy job once 6-E's infra/ exists to deploy against.
      - run: docker build -t multiprice-frontend:local .
      - run: docker save multiprice-frontend:local | gzip > frontend-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: apps/frontend/frontend-image.tar.gz
          retention-days: 1

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: apps/frontend

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Same shared ~/multiprice/infra stack as backend-ci.yml — see the
      # note there. This job only ever loads the frontend image; compose
      # only recreates the container whose image actually changed.
      - name: Copy deploy assets to droplet
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'mkdir -p ~/multiprice/infra'
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            infra/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/multiprice/infra/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            apps/frontend/frontend-image.tar.gz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/multiprice/frontend-image.tar.gz"

      - name: Load image and (re)start on droplet
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd ~/multiprice
            if [ ! -f infra/.env ]; then
              cp infra/.env.example infra/.env
              chmod 600 infra/.env
              echo "infra/.env created from the example. JWT_SECRET is still blank — set it by hand once before the stack will boot."
            fi
            docker load < frontend-image.tar.gz
            rm -f frontend-image.tar.gz
            docker compose -f infra/compose.yml up -d --no-build
          '

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ secrets.DEPLOY_HOST }}/"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 5
          done
          echo "Smoke test failed"
          exit 1
